name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            demo: build/bin/Release/nebenan_demo.exe
            tests: build/bin/Release/nebenan_test.exe
            benchmark: build/bin/Release/nebenan_benchmark.exe
          # The demo with zones for the Tracy profiler and the script that records the demolition, see NEBENAN_PROFILE in
          # the README. The benchmark measures the build without.
          - name: windows-tracy
            os: windows-latest
            profile: true
            demo: build/bin/Release/nebenan_demo.exe
            tests: build/bin/Release/nebenan_test.exe
          - name: linux
            os: ubuntu-latest
            demo: build/bin/nebenan_demo
            tests: build/bin/nebenan_test
            benchmark: build/bin/nebenan_benchmark
          - name: macos
            os: macos-latest
            demo: build/bin/nebenan_demo
            tests: build/bin/nebenan_test
            benchmark: build/bin/nebenan_benchmark

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libx11-dev libxi-dev libxcursor-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.profile && '-DNEBENAN_PROFILE=ON' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ${{ matrix.tests }}

      - name: Benchmark
        if: ${{ !matrix.profile }}
        run: ${{ matrix.benchmark }} 2

      # Without the tools of Tracy next to it, the script that records the demolition fetches them first
      - name: Test fetching Tracy in the recording script
        if: ${{ matrix.profile }}
        shell: cmd
        run: |
          mkdir script-test
          copy demo\Tracy-Aufnahme.bat script-test\
          call script-test\Tracy-Aufnahme.bat fetch
          if not exist script-test\tracy-capture.exe exit /b 1
          if not exist script-test\tracy-update.exe exit /b 1
          if not exist script-test\tracy-profiler.exe exit /b 1

      # A program that ends while Tracy records sends the rest of its data first, the capture has to end with it
      - name: Record the unit tests with Tracy
        if: ${{ matrix.profile }}
        timeout-minutes: 10
        run: |
          script-test/tracy-capture.exe -o tests.tracy -a 127.0.0.1 -f > capture.log 2>&1 &
          capture=$!
          sleep 2
          ${{ matrix.tests }} > tests.log
          wait $capture
          tail -c 400 capture.log
          test -s tests.tracy

      - name: Package demo
        run: |
          mkdir -p package/lizenzen
          cp "${{ matrix.demo }}" package/
          cp README.md package/LIESMICH.md
          cp extern/box3d/LICENSE package/lizenzen/box3d.txt
          cp extern/box3d/extern/sokol/LICENSE package/lizenzen/sokol.txt
          cp extern/imgui/LICENSE.txt package/lizenzen/imgui.txt
          if [ "${{ matrix.profile }}" = "true" ]; then
            # The build put the script next to the demo, as it does for build.bat tracy
            cp "$(dirname "${{ matrix.demo }}")/Tracy-Aufnahme.bat" package/
            cp .fetchcontent-cache/tracy-src/LICENSE package/lizenzen/tracy.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nebenan-demo-${{ matrix.name }}
          path: package/

  sanitizers:
    name: linux-sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEBENAN_DEMO=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize=alignment -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: build/bin/nebenan_test

  thread-sanitizer:
    name: linux-thread-sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEBENAN_DEMO=OFF -DNEBENAN_BENCHMARK=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=thread -g -O1"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"

      - name: Build
        run: cmake --build build --parallel

      # Without address space randomization, newer kernels map memory where TSan does not expect it
      - name: Unit tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: setarch "$(uname -m)" -R build/bin/nebenan_test
