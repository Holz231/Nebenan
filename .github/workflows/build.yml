name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            demo: build/bin/Release/nebenan_demo.exe
            tests: build/bin/Release/nebenan_test.exe
            benchmark: build/bin/Release/nebenan_benchmark.exe
          # The demo with zones for the Tracy profiler and the script that records the demolition, see NEBENAN_PROFILE in
          # the README. The benchmark measures the build without.
          - name: windows-tracy
            os: windows-latest
            profile: true
            demo: build/bin/Release/nebenan_demo.exe
            tests: build/bin/Release/nebenan_test.exe
          - name: linux
            os: ubuntu-latest
            demo: build/bin/nebenan_demo
            tests: build/bin/nebenan_test
            benchmark: build/bin/nebenan_benchmark
          - name: macos
            os: macos-latest
            demo: build/bin/nebenan_demo
            tests: build/bin/nebenan_test
            benchmark: build/bin/nebenan_benchmark

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libx11-dev libxi-dev libxcursor-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.profile && '-DNEBENAN_PROFILE=ON' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ${{ matrix.tests }}

      - name: Benchmark
        if: ${{ !matrix.profile }}
        run: ${{ matrix.benchmark }} 2

      # Without the tools of Tracy next to it, the script that records the demolition fetches them first
      - name: Test fetching Tracy in the recording script
        if: ${{ matrix.profile }}
        shell: cmd
        run: |
          mkdir script-test
          copy demo\Tracy-Aufnahme.bat script-test\
          call script-test\Tracy-Aufnahme.bat fetch
          if not exist script-test\tracy-capture.exe exit /b 1
          if not exist script-test\tracy-update.exe exit /b 1
          if not exist script-test\tracy-profiler.exe exit /b 1

      # A program that ends while Tracy records sends the rest of its data first, the capture has to end with it
      - name: Record the unit tests with Tracy
        if: ${{ matrix.profile }}
        timeout-minutes: 10
        run: |
          script-test/tracy-capture.exe -o tests.tracy -a 127.0.0.1 -f > capture.log 2>&1 &
          capture=$!
          sleep 2
          ${{ matrix.tests }} > tests.log
          wait $capture
          tail -c 400 capture.log
          test -s tests.tracy

      # The demo ends after 120 steps of the demolition, without and with Tracy recording. The runner draws with the
      # Basic Render Driver of Windows.
      - name: End the demo with and without Tracy
        if: ${{ matrix.profile }}
        timeout-minutes: 8
        run: |
          alive() { tasklist //FI "IMAGENAME eq $1" //NH | grep -qi "$1"; }
          "${{ matrix.demo }}" --demolition --threads 8 --fragment-scale 2 --serial-physics --frames 120 &
          for i in $(seq 1 90); do sleep 2; alive nebenan_demo.exe || break; done
          ended=yes
          alive nebenan_demo.exe && ended=no
          echo "without Tracy: the demo ended: $ended"
          taskkill //F //IM nebenan_demo.exe > /dev/null 2>&1 || true
          script-test/tracy-capture.exe -o demo.tracy -a 127.0.0.1 -f > demo-capture.log 2>&1 &
          sleep 2
          "${{ matrix.demo }}" --demolition --threads 8 --fragment-scale 2 --serial-physics --frames 120 &
          for i in $(seq 1 90); do sleep 2; alive nebenan_demo.exe || break; done
          alive nebenan_demo.exe && echo "with Tracy: the demo still runs after 180 s" || echo "with Tracy: the demo ended"
          for i in $(seq 1 15); do sleep 2; alive tracy-capture.exe || break; done
          alive tracy-capture.exe && echo "with Tracy: tracy-capture still runs" || echo "with Tracy: tracy-capture ended"
          alive nebenan_demo.exe && ended=no
          alive tracy-capture.exe && ended=no
          tail -c 500 demo-capture.log
          taskkill //F //IM nebenan_demo.exe > /dev/null 2>&1 || true
          taskkill //F //IM tracy-capture.exe > /dev/null 2>&1 || true
          test $ended = yes

      # The same while tracy-capture falls behind, as on the Ryzen: it is held until the demo has closed its window and
      # then goes on, and both have to end. If the demo still runs, the stacks of its threads show where it waits.
      - name: End the demo while Tracy falls behind
        if: ${{ matrix.profile }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          Add-Type -Namespace Win32 -Name NtDll -MemberDefinition @'
          [DllImport("ntdll.dll")] public static extern int NtSuspendProcess(IntPtr handle);
          [DllImport("ntdll.dll")] public static extern int NtResumeProcess(IntPtr handle);
          '@
          $capture = Start-Process -FilePath script-test\tracy-capture.exe -ArgumentList '-o','lag.tracy','-a','127.0.0.1','-f' -RedirectStandardOutput lag-capture.log -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          $demo = Start-Process -FilePath build\bin\Release\nebenan_demo.exe -ArgumentList '--demolition','--threads','8','--fragment-scale','2','--serial-physics','--frames','120' -PassThru
          do { Start-Sleep -Seconds 1; $demo.Refresh() } while ($demo.MainWindowHandle -eq 0 -and -not $demo.HasExited)
          Start-Sleep -Seconds 6
          [Win32.NtDll]::NtSuspendProcess($capture.Handle) | Out-Null
          "capture held"
          $deadline = (Get-Date).AddSeconds(240)
          do { Start-Sleep -Seconds 2; $demo.Refresh() } while ((Get-Date) -lt $deadline -and $demo.MainWindowHandle -ne 0 -and -not $demo.HasExited)
          "demo window closed: $($demo.MainWindowHandle -eq 0), demo ended: $($demo.HasExited)"
          Start-Sleep -Seconds 5
          [Win32.NtDll]::NtResumeProcess($capture.Handle) | Out-Null
          "capture goes on"
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not ($demo.HasExited -and $capture.HasExited)) { Start-Sleep -Seconds 2 }
          "after 90 s: demo ended $($demo.HasExited), capture ended $($capture.HasExited)"
          if (-not $demo.HasExited) {
            $demo.Refresh(); $t0 = $demo.TotalProcessorTime.TotalSeconds; Start-Sleep -Seconds 5; $demo.Refresh()
            "demo used $([math]::Round($demo.TotalProcessorTime.TotalSeconds - $t0, 2)) s of CPU in 5 s"
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue
            if ($cdb) { & $cdb.FullName -p $demo.Id -y build\bin\Release -c "~*k 20; qd" 2>&1 | Select-String -NotMatch '^\*\*\*|^Symbol|^ModLoad' }
            else { "no cdb on this runner" }
          }
          Get-Content lag-capture.log -Tail 8
          $ended = $demo.HasExited -and $capture.HasExited
          Stop-Process -Id $demo.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $capture.Id -Force -ErrorAction SilentlyContinue
          if (-not $ended) { exit 1 }

      - name: Package demo
        run: |
          mkdir -p package/lizenzen
          cp "${{ matrix.demo }}" package/
          cp README.md package/LIESMICH.md
          cp extern/box3d/LICENSE package/lizenzen/box3d.txt
          cp extern/box3d/extern/sokol/LICENSE package/lizenzen/sokol.txt
          cp extern/imgui/LICENSE.txt package/lizenzen/imgui.txt
          if [ "${{ matrix.profile }}" = "true" ]; then
            # The build put the script next to the demo, as it does for build.bat tracy
            cp "$(dirname "${{ matrix.demo }}")/Tracy-Aufnahme.bat" package/
            cp .fetchcontent-cache/tracy-src/LICENSE package/lizenzen/tracy.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nebenan-demo-${{ matrix.name }}
          path: package/

  sanitizers:
    name: linux-sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEBENAN_DEMO=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize=alignment -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: build/bin/nebenan_test

  thread-sanitizer:
    name: linux-thread-sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEBENAN_DEMO=OFF -DNEBENAN_BENCHMARK=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=thread -g -O1"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"

      - name: Build
        run: cmake --build build --parallel

      # Without address space randomization, newer kernels map memory where TSan does not expect it
      - name: Unit tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: setarch "$(uname -m)" -R build/bin/nebenan_test
